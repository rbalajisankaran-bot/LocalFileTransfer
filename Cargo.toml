[package]
name = "lan-transfer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lan-transfer"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
egui = "0.31"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
hostname = "0.4"
dirs = "5"
chrono = "0.4"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

# Windows: hide console window in release builds
[package.metadata.winres]
OriginalFilename = "lan-transfer.exe"
FileDescription = "LAN File Transfer"
