<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN File Transfer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface-hover: #222240;
      --surface-active: #2a2a50;
      --accent: #4a9eff;
      --accent-dim: #3a7ecc;
      --green: #4ade80;
      --green-dim: #22c55e;
      --red: #f87171;
      --yellow: #fbbf24;
      --text: #e8e8f0;
      --text-dim: #6b6b8d;
      --border: #2a2a45;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .logo { font-size: 20px; font-weight: 700; color: #8cc8ff; }
    .device-info { color: var(--text-dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }
    .device-name-edit {
      background: transparent; border: 1px solid transparent; color: var(--text);
      font-size: 13px; font-family: inherit; padding: 2px 6px; border-radius: 4px;
      width: 160px; outline: none; transition: border-color 0.2s;
    }
    .device-name-edit:hover { border-color: var(--border); }
    .device-name-edit:focus { border-color: var(--accent); background: var(--surface-hover); }

    .toggle {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; padding: 6px 16px; border-radius: 20px;
      background: rgba(248, 113, 113, 0.12); color: var(--red);
      font-size: 13px; font-weight: 500; transition: all 0.2s;
      user-select: none; border: 1px solid transparent;
    }
    .toggle:hover { border-color: var(--red); }
    .toggle.active { background: rgba(74, 222, 128, 0.12); color: var(--green); }
    .toggle.active:hover { border-color: var(--green); }
    .toggle-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red); transition: background 0.2s;
    }
    .toggle.active .toggle-dot { background: var(--green); }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .btn-shutdown {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 16px; border-radius: 20px; border: 1px solid transparent;
      background: rgba(248, 113, 113, 0.12); color: var(--red);
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all 0.2s; user-select: none;
    }
    .btn-shutdown:hover { border-color: var(--red); background: rgba(248, 113, 113, 0.22); }

    /* ── Main layout ── */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--surface);
      flex-shrink: 0;
    }
    .section-title {
      padding: 16px 16px 10px; font-size: 12px; font-weight: 600;
      color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.6px;
    }
    .peers { flex: 1; overflow-y: auto; padding: 0 8px 8px; }

    .peer {
      padding: 10px 12px; border-radius: var(--radius);
      cursor: pointer; transition: background 0.12s; margin-bottom: 2px;
      border: 1px solid transparent;
    }
    .peer:hover { background: var(--surface-hover); }
    .peer.selected {
      background: var(--surface-active);
      border-color: var(--accent);
    }
    .peer-name { font-weight: 500; font-size: 14px; }
    .peer-ip { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    .empty-msg {
      padding: 24px 16px; color: var(--text-dim);
      font-size: 13px; text-align: center; line-height: 1.5;
    }

    /* ── Content ── */
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Send panel ── */
    .send-panel { padding: 24px; border-bottom: 1px solid var(--border); }
    .send-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .send-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    .btn {
      padding: 9px 20px; border-radius: var(--radius); border: none;
      cursor: pointer; font-size: 14px; font-weight: 500;
      transition: all 0.12s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-browse { background: var(--accent); color: #fff; }
    .btn-browse:hover { background: var(--accent-dim); }
    .btn-send { background: var(--green); color: #0f0f1a; min-width: 140px; justify-content: center; }
    .btn-send:hover { background: var(--green-dim); }
    .btn-send:disabled {
      background: #2a2a3a; color: #555; cursor: not-allowed;
      transform: none;
    }

    .file-info { color: var(--text-dim); font-size: 13px; }
    .file-info.has-file { color: var(--text); font-weight: 500; }

    .file-list { margin-top: 12px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; background: var(--surface); border-radius: var(--radius);
      margin-bottom: 4px; font-size: 13px;
    }
    .file-item-left { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .file-item-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item-size { color: var(--text-dim); white-space: nowrap; }
    .file-item-radio { accent-color: var(--accent); cursor: pointer; }
    .file-item-remove {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 16px; padding: 0 4px; line-height: 1; transition: color 0.12s;
    }
    .file-item-remove:hover { color: var(--red); }

    .transfer-actions {
      display: flex; align-items: center; gap: 10px;
      margin-top: 8px; font-size: 12px;
    }
    .transfer-size { color: var(--text-dim); }
    .btn-open-folder {
      background: none; border: 1px solid var(--border); color: var(--accent);
      padding: 3px 10px; border-radius: 4px; cursor: pointer;
      font-size: 12px; transition: all 0.12s;
    }
    .btn-open-folder:hover { background: var(--surface-hover); border-color: var(--accent); }

    .download-dir {
      display: flex; align-items: center; gap: 8px; padding: 8px 24px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      font-size: 12px; color: var(--text-dim); flex-shrink: 0;
    }
    .download-dir-path {
      color: var(--text); font-weight: 500; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; max-width: 400px;
    }
    .btn-change-dir {
      background: none; border: 1px solid var(--border); color: var(--accent);
      padding: 2px 8px; border-radius: 4px; cursor: pointer;
      font-size: 11px; transition: all 0.12s; white-space: nowrap;
    }
    .btn-change-dir:hover { background: var(--surface-hover); border-color: var(--accent); }

    /* ── Update banner ── */
    .update-banner {
      display: none; align-items: center; justify-content: center; gap: 12px;
      padding: 8px 24px; background: rgba(74, 158, 255, 0.1);
      border-bottom: 1px solid var(--accent); font-size: 13px; flex-shrink: 0;
    }
    .update-banner.show { display: flex; }
    .update-banner span { color: var(--text); }
    .update-banner .version-new { color: var(--green); font-weight: 600; }
    .update-banner .version-old { color: var(--text-dim); }
    .btn-update {
      background: var(--accent); color: #fff; border: none; border-radius: 4px;
      padding: 3px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.12s;
    }
    .btn-update:hover { background: var(--accent-dim); }
    .btn-dismiss {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      font-size: 16px; padding: 0 4px; line-height: 1;
    }
    .btn-dismiss:hover { color: var(--text); }

    /* ── Transfers ── */
    .transfers-section { flex: 1; overflow-y: auto; padding: 16px 24px; }
    .transfer {
      padding: 14px; background: var(--surface); border-radius: var(--radius);
      margin-bottom: 8px;
    }
    .transfer-top { display: flex; justify-content: space-between; align-items: center; }
    .transfer-info { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .transfer-icon { font-size: 16px; }

    .badge {
      font-size: 12px; font-weight: 600; padding: 2px 10px;
      border-radius: 10px; white-space: nowrap;
    }
    .badge-completed { background: rgba(74,222,128,0.15); color: var(--green); }
    .badge-failed { background: rgba(248,113,113,0.15); color: var(--red); }
    .badge-waiting { background: rgba(251,191,36,0.15); color: var(--yellow); }
    .badge-progress { background: rgba(74,158,255,0.15); color: var(--accent); }

    .progress-track {
      height: 4px; background: var(--border); border-radius: 2px;
      margin-top: 10px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: var(--accent); border-radius: 2px;
      transition: width 0.3s ease;
    }
    .transfer-meta {
      display: flex; justify-content: space-between;
      margin-top: 6px; font-size: 12px; color: var(--text-dim);
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
      z-index: 100; align-items: center; justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 28px 32px; min-width: 380px;
      text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
    .modal-sender { color: var(--text-dim); font-size: 14px; margin-bottom: 6px; }
    .modal-file { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .modal-size { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
    .modal-buttons { display: flex; gap: 12px; justify-content: center; }
    .btn-accept {
      background: var(--green); color: #0f0f1a; padding: 10px 32px;
      border-radius: var(--radius); border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.12s;
    }
    .btn-accept:hover { background: var(--green-dim); }
    .btn-reject {
      background: var(--red); color: #fff; padding: 10px 32px;
      border-radius: var(--radius); border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.12s;
    }
    .btn-reject:hover { opacity: 0.85; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a55; }

    /* ── Connection status ── */
    .conn-status {
      position: fixed; bottom: 12px; right: 16px;
      font-size: 13px; color: var(--text); opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">&#8652; LAN Transfer</div>
      <div class="device-info">
        <input class="device-name-edit" id="device-name" type="text" maxlength="50" title="Click to edit device name" />
        <span style="color:var(--text-dim)">&#183;</span>
        <span id="local-ip"></span>
      </div>
    </div>
    <div class="header-right">
      <div class="toggle" id="toggle" onclick="api('toggle')">
        <div class="toggle-dot"></div>
        <span id="toggle-text">Hidden</span>
      </div>
      <button class="btn-shutdown" onclick="doShutdown()" title="Stop the server">
        &#x23FB; Stop Server
      </button>
    </div>
  </div>

  <!-- Update banner -->
  <div class="update-banner" id="update-banner">
    <span>Update available: <span class="version-old" id="ver-current"></span> → <span class="version-new" id="ver-latest"></span></span>
    <button class="btn-update" id="update-btn" onclick="doUpdate()">Update Now</button>
    <button class="btn-dismiss" onclick="dismissUpdate()" title="Dismiss">&times;</button>
  </div>

  <!-- Download location -->
  <div class="download-dir">
    <span>Save to:</span>
    <span class="download-dir-path" id="download-dir" title=""></span>
    <button class="btn-change-dir" onclick="api('set-download-dir')">Change</button>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Sidebar: peers -->
    <div class="sidebar">
      <div class="section-title">Nearby Devices</div>
      <div class="peers" id="peers"></div>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Send panel -->
      <div class="send-panel">
        <div class="send-title">Send File</div>
        <div class="send-row">
          <button class="btn btn-browse" id="browse-btn" onclick="doBrowse()">Browse</button>
          <span class="file-info" id="file-info">No files added</span>
        </div>
        <div class="file-list" id="file-list"></div>
        <div class="send-row" style="margin-top: 12px;">
          <button class="btn btn-send" id="send-btn" onclick="doSend()" disabled>Send</button>
        </div>
      </div>

      <!-- Transfers -->
      <div class="transfers-section">
        <div class="section-title" style="padding: 0 0 12px;">Transfers</div>
        <div id="transfers"></div>
      </div>
    </div>
  </div>

  <!-- Incoming request modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <!-- Connection status -->
  <div class="conn-status"><span id="conn-status"></span> <span id="version-text"></span></div>

<script>
  // ──────────────────────────────────────────────────────────────────────────
  // State
  // ──────────────────────────────────────────────────────────────────────────
  let state = {};
  let selectedPeerId = null;
  let selectedFileId = null;
  let browsing = false;

  // ──────────────────────────────────────────────────────────────────────────
  // SSE connection
  // ──────────────────────────────────────────────────────────────────────────
  let evtSource = null;
  function connectSSE() {
    evtSource = new EventSource('/events');
    evtSource.onmessage = e => {
      state = JSON.parse(e.data);
      console.log('[sse] State update — peers:', state.peers?.length, 'files:', state.sharedFiles?.length,
        'transfers:', state.transfers?.length, 'incoming:', !!state.incomingRequest);
      // Auto-select the latest file if none selected
      if (!selectedFileId && state.sharedFiles && state.sharedFiles.length > 0) {
        selectedFileId = state.sharedFiles[state.sharedFiles.length - 1].id;
      }
      render();
    };
    evtSource.onopen = () => {
      console.log('[sse] Connected');
      document.getElementById('conn-status').textContent = '';
    };
    evtSource.onerror = (e) => {
      console.error('[sse] Error/disconnected', e);
      document.getElementById('conn-status').textContent = 'Reconnecting...';
    };
  }
  connectSSE();

  // ──────────────────────────────────────────────────────────────────────────
  // API
  // ──────────────────────────────────────────────────────────────────────────
  function api(endpoint, data) {
    console.log('[api]', endpoint, data || '');
    return fetch('/api/' + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data || {}),
    }).then(r => {
      console.log('[api]', endpoint, 'response:', r.status);
      return r;
    }).catch(err => {
      console.error('[api]', endpoint, 'error:', err);
    });
  }

  function selectPeer(id) {
    selectedPeerId = (selectedPeerId === id) ? null : id;
    render();
  }

  function selectFile(id) {
    selectedFileId = id;
    render();
  }

  function removeFile(id) {
    api('remove-file', { fileId: id });
    if (selectedFileId === id) selectedFileId = null;
  }

  function doBrowse() {
    console.log('[browse] Clicked');
    api('browse');
  }

  function doSend() {
    if (selectedPeerId && selectedFileId) {
      api('send', { peerId: selectedPeerId, fileId: selectedFileId });
    }
  }

  function respondTransfer(accepted) {
    console.log('[respondTransfer] accepted:', accepted);
    api('respond', { accepted: accepted });
  }

  function openFolder(transferId) {
    console.log('[openFolder] transferId:', transferId);
    api('open-folder', { transferId: transferId });
  }

  let updateDismissed = false;

  function doUpdate() {
    const btn = document.getElementById('update-btn');
    btn.textContent = 'Updating...';
    btn.disabled = true;
    api('do-update');
    // Server will restart — poll until it's back
    setTimeout(function poll() {
      fetch('/api/ping').then(() => {
        window.location.reload();
      }).catch(() => {
        setTimeout(poll, 1000);
      });
    }, 3000);
  }

  function dismissUpdate() {
    updateDismissed = true;
    document.getElementById('update-banner').classList.remove('show');
  }

  function doShutdown() {
    if (confirm('Stop the server? This will close LAN Transfer.')) {
      api('shutdown');
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#6b6b8d;font-size:18px;">Server stopped. You can close this tab.</div>';
    }
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Device name editing
  // ──────────────────────────────────────────────────────────────────────────
  const nameInput = document.getElementById('device-name');
  let nameLoaded = false;
  nameInput.addEventListener('change', () => {
    const val = nameInput.value.trim();
    if (val) api('rename', { name: val });
  });
  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') nameInput.blur();
  });

  // ──────────────────────────────────────────────────────────────────────────
  // Render
  // ──────────────────────────────────────────────────────────────────────────
  function render() {
    // Device name (only set once to avoid clobbering user edits)
    if (!nameLoaded && state.deviceName) {
      nameInput.value = state.deviceName;
      nameLoaded = true;
    }
    document.getElementById('local-ip').textContent = state.localIP || '';
    document.getElementById('version-text').textContent = state.currentVersion ? 'v' + state.currentVersion : '';

    // Update banner
    const banner = document.getElementById('update-banner');
    if (!updateDismissed && state.latestVersion && state.currentVersion && state.latestVersion !== state.currentVersion) {
      document.getElementById('ver-current').textContent = 'v' + state.currentVersion;
      document.getElementById('ver-latest').textContent = 'v' + state.latestVersion;
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }

    // Download dir
    const dirEl = document.getElementById('download-dir');
    dirEl.textContent = state.downloadDir || '';
    dirEl.title = state.downloadDir || '';

    // Toggle
    const toggle = document.getElementById('toggle');
    const toggleText = document.getElementById('toggle-text');
    if (state.isDiscoverable) {
      toggle.classList.add('active');
      toggleText.textContent = 'Discoverable';
    } else {
      toggle.classList.remove('active');
      toggleText.textContent = 'Hidden';
    }

    // Peers
    const peersEl = document.getElementById('peers');
    if (!state.peers || state.peers.length === 0) {
      peersEl.innerHTML = '<div class="empty-msg">Searching for nearby devices&hellip;<br><br><small>Make sure both devices are on the same WiFi</small></div>';
    } else {
      if (selectedPeerId && !state.peers.some(p => p.id === selectedPeerId)) {
        selectedPeerId = null;
      }
      peersEl.innerHTML = state.peers.map(p =>
        '<div class="peer' + (selectedPeerId === p.id ? ' selected' : '') + '" onclick="selectPeer(\'' + esc(p.id) + '\')">'
        + '<div class="peer-name">' + esc(p.name) + '</div>'
        + '<div class="peer-ip">' + esc(p.ip) + '</div>'
        + '</div>'
      ).join('');
    }

    // Shared files
    const files = state.sharedFiles || [];
    const fileInfoEl = document.getElementById('file-info');
    const fileListEl = document.getElementById('file-list');

    if (files.length === 0) {
      fileInfoEl.className = 'file-info';
      fileInfoEl.textContent = 'No files added';
      fileListEl.innerHTML = '';
      selectedFileId = null;
    } else {
      fileInfoEl.className = 'file-info has-file';
      fileInfoEl.textContent = files.length + ' file' + (files.length > 1 ? 's' : '') + ' ready to send';
      // Validate selection
      if (selectedFileId && !files.some(f => f.id === selectedFileId)) {
        selectedFileId = files[files.length - 1].id;
      }
      fileListEl.innerHTML = files.map(f =>
        '<div class="file-item">'
        + '<div class="file-item-left">'
        + '<input type="radio" name="sel-file" class="file-item-radio" '
        + (selectedFileId === f.id ? 'checked ' : '')
        + 'onchange="selectFile(\'' + esc(f.id) + '\')" />'
        + '<span class="file-item-name">' + esc(f.name) + '</span>'
        + '<span class="file-item-size">' + formatSize(f.size) + '</span>'
        + '</div>'
        + '<button class="file-item-remove" onclick="removeFile(\'' + esc(f.id) + '\')" title="Remove">&times;</button>'
        + '</div>'
      ).join('');
    }

    // Send button
    const sendBtn = document.getElementById('send-btn');
    const canSend = !!(selectedPeerId && selectedFileId && state.peers && state.peers.some(p => p.id === selectedPeerId));
    sendBtn.disabled = !canSend;
    if (canSend) {
      const peer = state.peers.find(p => p.id === selectedPeerId);
      sendBtn.textContent = 'Send to ' + (peer ? peer.name : 'peer');
    } else if (selectedPeerId && !selectedFileId) {
      sendBtn.textContent = 'Select a file first';
    } else if (!selectedPeerId && selectedFileId) {
      sendBtn.textContent = 'Select a device first';
    } else {
      sendBtn.textContent = 'Send';
    }

    // Transfers
    const transfersEl = document.getElementById('transfers');
    if (!state.transfers || state.transfers.length === 0) {
      transfersEl.innerHTML = '<div class="empty-msg">No transfers yet</div>';
    } else {
      transfersEl.innerHTML = state.transfers.slice().reverse().map(renderTransfer).join('');
    }

    // Modal
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal');
    if (state.incomingRequest) {
      const req = state.incomingRequest;
      overlay.classList.add('show');
      modal.innerHTML =
        '<div class="modal-title">Incoming File</div>'
        + '<div class="modal-sender">' + esc(req.senderName) + ' wants to send you:</div>'
        + '<div class="modal-file">' + esc(req.filename) + '</div>'
        + '<div class="modal-size">' + formatSize(req.size) + '</div>'
        + '<div class="modal-buttons">'
        + '<button class="btn-accept" onclick="respondTransfer(true)">Accept</button>'
        + '<button class="btn-reject" onclick="respondTransfer(false)">Reject</button>'
        + '</div>';
    } else {
      overlay.classList.remove('show');
    }
  }

  function renderTransfer(t) {
    const icon = t.direction === 'send' ? '\u2B06' : '\u2B07';
    const arrow = t.direction === 'send' ? '\u2192' : '\u2190';
    const peer = t.peerName || 'Unknown';

    let badgeClass, badgeText;
    switch (t.status) {
      case 'completed': badgeClass = 'badge-completed'; badgeText = '\u2713 Done'; break;
      case 'failed':    badgeClass = 'badge-failed';    badgeText = '\u2717 ' + (t.error || 'Failed'); break;
      case 'waiting':   badgeClass = 'badge-waiting';   badgeText = 'Waiting\u2026'; break;
      default:          badgeClass = 'badge-progress';  badgeText = t.progress + '%'; break;
    }

    let extra = '';
    if (t.status === 'in_progress') {
      extra =
        '<div class="progress-track"><div class="progress-fill" style="width:' + t.progress + '%"></div></div>'
        + '<div class="transfer-meta">'
        + '<span>' + formatSize(t.size) + '</span>'
        + '<span>' + formatSpeed(t.speed) + '</span>'
        + '</div>';
    } else if (t.status === 'completed' || t.status === 'failed') {
      extra = '<div class="transfer-actions">'
        + '<span class="transfer-size">' + formatSize(t.size) + '</span>';
      if (t.status === 'completed' && t.direction === 'receive' && t.savePath) {
        extra += '<button class="btn-open-folder" onclick="openFolder(\'' + esc(t.id) + '\')">Open Folder</button>';
      }
      extra += '</div>';
    }

    const encrypted = (t.status === 'in_progress' || t.status === 'completed') ? ' \uD83D\uDD12' : '';

    return '<div class="transfer">'
      + '<div class="transfer-top">'
      + '<div class="transfer-info">'
      + '<span class="transfer-icon">' + icon + '</span>'
      + '<span>' + esc(t.filename) + ' ' + arrow + ' ' + esc(peer) + encrypted + '</span>'
      + '</div>'
      + '<span class="badge ' + badgeClass + '">' + badgeText + '</span>'
      + '</div>'
      + extra
      + '</div>';
  }

  // ──────────────────────────────────────────────────────────────────────────
  // Utilities
  // ──────────────────────────────────────────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function formatSize(bytes) {
    if (!bytes || bytes <= 0) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
    return (bytes / 1073741824).toFixed(1) + ' GB';
  }

  function formatSpeed(bps) {
    if (!bps || bps <= 0) return '';
    if (bps < 1024) return bps.toFixed(0) + ' B/s';
    if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
    return (bps / 1048576).toFixed(1) + ' MB/s';
  }
</script>
